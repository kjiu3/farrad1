# CI: يُشغَّل على كل Pull Request وعلى الدفع للفرع الرئيسي.
# المرحلة 0: فحص المستندات فقط. وظائف البناء والاختبار الحقيقية
# تُفعَّل من المرحلة 1 (هيكل المشروع) وفق ADR-0007 وAGENTS.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # فحص المستندات على ثلاثة أنظمة (لينكس/ويندوز/ماك) تنفيذًا لقاعدة العمل
  docs-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: فحص صياغة Markdown
        run: npx --yes markdownlint-cli "**/*.md"
        # قواعد التخصيص في ملف .markdownlint.yml (راجعها عند إضافة قواعد جديدة)

  # فحص الروابط بين ملفات المستودع
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فحص الروابط
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --max-retries 2
            --no-progress
            './**/*.md'

  # اختبارات Flutter على الأنظمة الثلاثة (بداية من المرحلة 1 — فرع stage1/flutter-scaffold)
  flutter-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter analyze
        run: flutter analyze
        working-directory: app
      - name: flutter test
        run: flutter test
        working-directory: app

  # وظائف البناء الفعلية لكل منصة (زاوية المرحلة 1 رقم 1 في ROADMAP).
  # مصفوفة include: كل هدف منصة يبني على نظام المستضيف المطلوب.
  platform-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: linux
            os: ubuntu-latest
          - target: android
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # جافا مطلوب لأبناء أندرويد فقط (يتطلب الإصدار 17 مورد سوركو شرعي).
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # مكتبات سطح المكتب لينكس لابد منها قبل بناء لينكس.
      - name: تثبيت اعتماديات لينكس
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: بناء ويندوز
        if: matrix.target == 'windows'
        run: flutter build windows --debug
        working-directory: app
      - name: بناء ماك
        if: matrix.target == 'macos'
        run: flutter build macos --debug
        working-directory: app
      - name: بناء لينكس
        if: matrix.target == 'linux'
        run: flutter build linux --debug
        working-directory: app
      - name: بناء أندرويد
        if: matrix.target == 'android'
        run: flutter build apk --debug
        working-directory: app
      - name: بناء الويب
        if: matrix.target == 'web'
        run: flutter build web
        working-directory: app
